name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per branch/PR: a newer push cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholders so the web build has the public variables; no real secrets in CI.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      DOMUS_ENVIRONMENT: local
    steps:
      - uses: actions/checkout@v6

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database:
    name: Database (pgTAP, RLS isolation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The Supabase CLI is pinned in the root devDependencies.
      - run: pnpm install --frozen-lockfile

      # Only Postgres and Auth (the `auth` schema is created by GoTrue and
      # RLS tests create users). Every other service is excluded to start faster.
      - name: Start local Supabase (database services only)
        run: >
          pnpm supabase start
          -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Run pgTAP tests
        run: pnpm test:db

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase stop --no-backup

  e2e:
    name: E2E (Playwright, local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOMUS_ENVIRONMENT: local
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm --filter @domus/web exec playwright install --with-deps chromium

      # Auth, API gateway, Postgres, Storage (logo upload), the Edge runtime (invitations, support sessions) and
      # the mail catcher are needed by the e2e suite; migrations and the seed (two fictional tenants and the test
      # users) are applied on start.
      - name: Start local Supabase
        run: >
          pnpm supabase start
          -x realtime,imgproxy,studio,logflare,vector,supavisor,postgres-meta

      - name: Export the public Supabase variables
        run: |
          eval "$(pnpm -s supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      # Writes the gitignored supabase/.env.local (function secrets generated now, never committed).
      - name: Prepare the Edge Function environment
        run: node scripts/prepare-function-env.mjs

      - name: Serve Edge Functions
        run: |
          nohup pnpm supabase functions serve --env-file supabase/.env.local > functions.log 2>&1 &
          echo "FUNCTIONS_SERVE_PID=$!" >> "$GITHUB_ENV"

      # Fails the job (instead of letting tests skip or time out) when Storage, a function or Mailpit is missing.
      - name: Wait for Storage, Edge Functions and Mailpit
        run: node scripts/e2e-preflight.mjs --wait

      - name: Build
        run: pnpm build

      # Playwright starts `next start` itself (see apps/web/playwright.config.ts).
      - name: Run Playwright
        run: pnpm --filter @domus/web test:e2e

      # Independent real-HTTP security probes (support tokens vs PostgREST/Auth/RPCs/functions, invitation consent).
      # They run after Playwright so their fictional fixtures never affect it, and even when Playwright failed.
      # Keys come from `supabase status`; the served functions and Mailpit are already up.
      - name: HTTP security probes
        if: ${{ !cancelled() }}
        run: node --test supabase/probes/http-security.test.mjs

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            functions.log
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: |
          kill "$FUNCTIONS_SERVE_PID" 2>/dev/null || true
          pnpm supabase stop --no-backup
