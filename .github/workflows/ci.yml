name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per branch/PR: a newer push cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholders so the web build has the public variables; no real secrets in CI.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      DOMUS_ENVIRONMENT: local
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database:
    name: Database (pgTAP, RLS isolation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The Supabase CLI is pinned in the root devDependencies.
      - run: pnpm install --frozen-lockfile

      # Only Postgres and Auth (the `auth` schema is created by GoTrue and
      # RLS tests create users). Every other service is excluded to start faster.
      - name: Start local Supabase (database services only)
        run: >
          pnpm supabase start
          -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Run pgTAP tests
        run: pnpm test:db

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase stop --no-backup

  e2e:
    name: E2E (Playwright, local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOMUS_ENVIRONMENT: local
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm --filter @domus/web exec playwright install --with-deps chromium

      # Auth, API gateway, Postgres and the mail catcher are enough for the e2e suite; migrations and the seed
      # (two fictional tenants and the test users) are applied on start.
      - name: Start local Supabase
        run: >
          pnpm supabase start
          -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Export the public Supabase variables
        run: |
          eval "$(pnpm -s supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build

      # Playwright starts `next start` itself (see apps/web/playwright.config.ts).
      - name: Run Playwright
        run: pnpm --filter @domus/web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase stop --no-backup
